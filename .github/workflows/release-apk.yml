name: Build & Release APK (Checklist Valise)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Préparer & synchroniser Capacitor
        run: |
          npm ci
          mkdir -p www
          cp index.html app.js data.js style.css manifest.webmanifest sw.js icon-192.png icon-512.png www/
          npx cap sync android

      - name: Compiler l'APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Checklist-Valise.apk

      - name: Publier sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Checklist Valise — Build #${{ github.run_number }}"
          make_latest: true
          files: Checklist-Valise.apk
